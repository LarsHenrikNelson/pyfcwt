[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyfcwt"
version = "0.1.0"
description = "A pure-Python fast continuous wavelet transform (fCWT) implementation"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numba>=0.65.1",
    "numpy>=2.4.4",
    "pyfftw>=0.15.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
